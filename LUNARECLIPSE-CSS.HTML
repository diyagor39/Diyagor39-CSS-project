<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lunar Eclipse</title>
       <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: aliceblue;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            /* display: flex;
            justify-content: center;
            text-align: center; */
        }
        .universe {
            width: 40vw;
            aspect-ratio: 1;
            background-color: yellow;
             display: grid;
            place-items: center;
            border-radius: 12px;
            animation: skychange 10s ease-in-out infinite;
        }
        @keyframes skychange{
            0%{
                background-color: yellow;
            }
            25%{
                background-color: rgb(189, 162, 12);
            }
            50%{
                background-color: #000;
            }
            75%{
                background-color: #e1f00d;
            }
            100%{
                background-color: #e6f513;
            }
        }
        

        .sun {
            width: 18vw;
            aspect-ratio: 1;
            background-color:orangered;
           border-radius: 50%;
           position: relative;
           overflow: hidden;

           &::after{
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            border-radius: inherit;
            width: inherit;
            aspect-ratio: 1;
            background-color: #000;
            animation: moonwalk 10s ease-in-out infinite;
           }
        }

        @keyframes moonwalk{
            0%{
                translate: 100%;
                scale: 1;
            }
            50%{
                translate: 0%;
                scale: 0.9;
                box-shadow: rgba(0 0 0 0.5),palevioletred;
            }
            100%{
                translate: -100%;
                scale: 0.9;
            }
        }
       </style>

    </head>
    <body>
        <div class="universe">
        <div class="sun"></div>
        </div>
    </body>
</html>
