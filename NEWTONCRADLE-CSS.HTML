<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <title>newton cradle</title>
      <style>
        *{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        
        html{
          font-size: 62.5%;
        }
        body {
          height: 100vh;
          display: grid;
          place-items: center;
          background-color: black;
        }
         
        .cradle{
            width: 50rem;
            height: 50rem;
            background-color: transparent;
            border-top: 2rem solid blueviolet;
            border-radius: 1rem;
            display: flex;
            /* justify-content: space-around; */
           /* gap: 20px; */
           justify-content: center;
           gap: 4.5rem;
        }
      
        div{
            width: 0.5rem;
            height: 20rem;
            background-color: blueviolet;
            position: relative;
        }

       .cradle div::before{
          content: " ";
          position: absolute;
          bottom: 0;
          left: -2.25rem;
          width: 50px;
          aspect-ratio: 1;
          border-radius: 50%;
          background-color: blueviolet;
        }
       .cradle div:first-child{
        animation: left-swing 2s linear infinite;
        transform-origin: top left;
       }

       .cradle div:last-child{
        animation: right-swing 2s linear 1s infinite;
        transform-origin: top left;
       }
       @keyframes left-swing {
        0%{
          rotate: 0deg;
          transform-origin: top left;
        }
        25%{
          rotate: 30deg;
        }
        50%{
          rotate: 0deg;
        }
        100%{
          rotate: 0deg;
        }
       }

       @keyframes right-swing {
        0%{
          rotate: 0deg;
          transform-origin: top left;
        }
        25%{
          rotate: -30deg;
        }
        50%{
          rotate: 0deg;
        }
        100%{
          rotate: 0deg;
        }
       }
        
       
        </style>
        </head>
        <body>
            <div class="cradle">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            </div>           
            </body>
            </html>
