<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <title>SUBSCRIBE</title>
      <style>
        *{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        body {
          height: 100vh;
          display: grid;
          place-items: center;
          background-color: black;
          text-align: center;
        }
        h1{
            text-align: center;
            color:#fff;
            font-weight: bold;
            font-size: 96px;
            text-shadow:-1px 2px 3px rgba(236,247,76,0.2);
            position: relative;
        }

        h1::before{
            content: "SUBSCRIBE...";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            color: yellow;
            text-transform: uppercase;
            border-right: 2px solid yellow;
            overflow: hidden;
            animation: textreveal 2s linear infinite alternate;
        }
        @keyframes textreveal {
            0% {
                width: 0;
            }
            50% {
                width: 100;
            }
            
        }
        </style>
        </head>
        <body>
            <h1>SUBSCRIBE...</h1>
        </body>
    </html>
